spring.application.name=backend
server.port = 8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_db}                                                                                                                                                                                                                
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todo_user}                                                                                                                                                                                                                                   
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todo_pass}  

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect