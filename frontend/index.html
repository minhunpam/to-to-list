<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Todo List</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="index.js" defer></script>
    </head>

    <body>
        <div class="wrapper">
            <header class="todo-header">
                <h2 class="todo-title">To-do List</h2>
            </header>
            <div class="container">
                <div class="side input-side">
                    <div class="field">
                        <input type="text" id="titleInput" placeholder="What do you plan to do?">
                        <small class="error" id="titleError"></small>
                    </div>
                    <div class="field">
                        <textarea id="descriptionInput" placeholder="Description"></textarea>
                        <small class="error" id="descriptionError"></small>
                    </div>
                    <button id="doneButton" disabled>Done</button>
                </div>
                <div class="side display-side">
                    <div id="todoList" class="todo-list" aria-live="polite"></div>
                </div>
            </div>
        </div>
        <dialog id="delete-modal">
            <h2>Are you sure to delete this to-do?</h2>
            <div class="modal-buttons-container">
                <button class="modal-button" id="confirm-button">Confirm</button>
                <button class="modal-button" id="cancel-button">Cancel</button>
            </div>
        </dialog>
    </body>

</html>
